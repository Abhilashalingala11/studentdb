<!DOCTYPE html>
<html>
<head>
    <title>Student Management</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<h2>Student Management System</h2>
<h1>lets check</h1>

<!-- ADD STUDENT -->
<h3>Add Student</h3>

<input type="text" id="name" placeholder="Name">
<input type="text" id="course" placeholder="Course">
<button onclick="addStudent()">Add</button>

<hr>

<!-- VIEW STUDENTS -->
<h3>Students List</h3>




<table border="1" id="table">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Actions</th>
    </tr>
</table>
<script>

    function addStudent() {

        let student = {
            name: document.getElementById("name").value,
            course: document.getElementById("course").value
        };

        fetch("/addStudent", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        })
            .then(res => res.json())
            .then(() => {
                alert("Student Added!");
                getStudents();
            });
    }

    function getStudents() {

        fetch("/students")
            .then(res => res.json())
            .then(data => {

                let table = document.getElementById("table");



                   table.innerHTML = `
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        `;





                data.forEach(s => {
                    table.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.course}</td>
                    <td>
                       <button onclick="editStudent(${s.id})">Edit</button>
                        <button onclick="deleteStudent(${s.id})">Delete</button>
                    </td>
                </tr>
            `;
                });

            });
    }

    function deleteStudent(id) {

        fetch("/students/" + id, {
            method: "DELETE"
        })
            .then(() => {
                alert("Deleted successfully!");
                getStudents();
            });
    }

    function editStudent(id, name, course) {

        let newName = prompt("Enter new name", name);
        let newCourse = prompt("Enter new course", course);

        let updatedStudent = {
            name: newName,
            course: newCourse
        };

        fetch("/students/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(updatedStudent)
        })
            .then(() => {
                alert("Updated successfully!");
                getStudents();
            });
    }

</script>

</body>
</html>
